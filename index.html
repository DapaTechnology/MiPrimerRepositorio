<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hola Mundo Dapatechnology</title>

    <!-- Bootstrap 5 -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link 
        rel="stylesheet" 
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;

            background: linear-gradient(
                135deg,
                #0f172a,
                #1e3a8a,
                #2563eb
            );

            font-family: Arial, sans-serif;
        }

        .card-custom {
            max-width: 600px;
            width: 90%;
            padding: 50px 40px;
            border: none;
            border-radius: 25px;

            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);

            color: white;
            text-align: center;

            animation: aparecer 1s ease;
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            color: #60a5fa;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .descripcion {
            font-size: 1.15rem;
            color: #dbeafe;
            margin-bottom: 30px;
        }

        .btn-custom {
            border: none;
            border-radius: 50px;
            padding: 12px 30px;
            font-weight: bold;

            background: #3b82f6;
            color: white;

            transition: all 0.3s ease;
        }

        .btn-custom:hover {
            background: #60a5fa;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 576px) {
            h1 {
                font-size: 2.5rem;
            }

            .card-custom {
                padding: 40px 25px;
            }
        }
    </style>
</head>

<body>

    <div class="card-custom">

        <div class="icon">
            <i class="bi bi-stars"></i>
        </div>

        <h1>¡Hola Primer Mundo ! 👋</h1>

        <p class="descripcion">
            Bienvenido a mi primera página web creada con
            <strong>HTML + Bootstrap</strong>.
        </p>

        <button 
            class="btn btn-custom"
            onclick="mostrarMensaje()"
        >
            <i class="bi bi-rocket-takeoff me-2"></i>
            Comenzar
        </button>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function mostrarMensaje() {
            alert("¡Hola Mundo! 🚀 Bienvenido a tu nueva página web.");
        }
    </script>

</body>
</html>
